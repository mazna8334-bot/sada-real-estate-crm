
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سادة التطوير للعقارات</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.get('user') %}
<div class="layout">
<aside class="sidebar">
  <div class="brand">سادة التطوير <span>للعقارات</span></div>
  <nav>
    <a href="{{ url_for('dashboard') }}">لوحة التحكم</a>
    <a href="{{ url_for('clients') }}">العملاء</a>
    <a href="{{ url_for('owners') }}">الملاك</a>
    <a href="{{ url_for('properties') }}">العقارات</a>
    <a href="{{ url_for('requests_page') }}">الطلبات</a>
    <a href="{{ url_for('deals') }}">الصفقات</a>
    <a href="{{ url_for('logout') }}">تسجيل الخروج</a>
  </nav>
</aside>
<main class="main">{% block content %}{% endblock %}</main>
</div>
{% else %}
{% block public %}{% endblock %}
{% endif %}
<script>
function toggleModal(id){document.getElementById(id).classList.toggle('show')}
</script>
</body>
</html>
